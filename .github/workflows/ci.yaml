# Used when a commit is pushed to the repository
# This makes use of caching for faster builds and uploads the resulting artifacts
name: ci
on: push

env:
  CELERITAS_DISABLE_DECOMP: true

jobs:
  build:
    runs-on: ubuntu-large

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            8
            17
            21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.4
      - name: Build the patched 1.8.9 client
        run: ./gradlew :patched-client:assemble --info --stacktrace
      - name: Run common tests
        run: ./gradlew :common:test --stacktrace
      - name: Show checksums
        run: sha256sum patched-client/build/libs/client.jar patched-client/build/libs/client.tpatch
